<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
    </head>
    <body>
        <h1>Lista de notas</h1>
        {% for nota in notas %}
            {% if nota > 6 %}
                <p style="color: green">Aprobado: {{ nota }}</p>
            {% else %}
                <p style="color: red;">Desaprobado: {{ nota }}</p>
            {% endif %}
        {% endfor %}
        <a href="{% url 'prueba:home' %}">Volver</a>
    </body>
</html>
