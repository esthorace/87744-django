{% extends "core/base.html" %}

{% block content %}
    <h1>Login</h1>
    <form method="post">
        {% csrf_token %}
        <label for="username">Usuario:</label>
        <input type="text"
               name="username"
               id="username"
               required
               autocomplete="username" />
        <label for="password">Constraseña:</label>
        <input type="password"
               id="password"
               name="password"
               autocomplete="current-password"
               required />
        <button type="submit">Iniciar sesión</button>
        {% if error %}
            <p>{{ error }}</p>
        {% endif %}
    </form>
{% endblock content %}
