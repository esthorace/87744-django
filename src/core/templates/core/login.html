{% extends "core/base.html" %}
{% load static %}

{% block styles %}
    <link rel="stylesheet" href="{% static 'core/css/form.css' %}" />
{% endblock styles %}

{% block content %}
    <section class="section">
        <div class="container">
            <h1 class="page-title">Iniciar sesión</h1>
            <form class="form" method="post">
                {% csrf_token %}
                <p>
                    <label for="username">Usuario:</label>
                    <input type="text"
                           name="username"
                           id="username"
                           required
                           autofocus
                           autocomplete="username" />
                </p>
                <p>
                    <label for="password">Contraseña:</label>
                    <input type="password"
                           id="password"
                           name="password"
                           autocomplete="current-password"
                           required />
                </p>
                {% if error %}<p class="errorlist" role="alert">{{ error }}</p>{% endif %}
                <div class="form-actions">
                    <button class="button button-primary" type="submit">Iniciar sesión</button>
                </div>
            </form>
        </div>
    </section>
{% endblock content %}
