<div class="nav">
    <div class="container nav-inner">
        <a href="/" class="brand" aria-label="La Esquina, inicio">
            <span class="brand-mark">✦</span>
            <span>La Esquina</span>
        </a>
        <nav class="nav-links" aria-label="Navegación principal">
            {% if not user.is_authenticated %}
                <a href="#productos">Qué tenemos</a>
                <a href="#nosotros">La despensa</a>
                <a href="#contacto">Contacto</a>
            {% endif %}
            {% if user.is_authenticated %}
                <a href="{% url 'ventas:home' %}" class="nav-cta">Ventas</a>
                <span class="nav-user">{{ user.username }}</span>
                <form action="{% url 'core:logout' %}" method="post">
                    {% csrf_token %}
                    <button class="nav-logout" type="submit">Logout</button>
                </form>
            {% else %}
                <a href="{% url 'core:login' %}" class="nav-cta">Acceder</a>
            {% endif %}
        </nav>
    </div>
</div>
